default_settings: null
behaviors:
  FootsiesAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      beta: 1.0e-5
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        strength: 0.3         
        gamma: 0.99
        demo_path: C:\Users\Ciaran\Documents\GitHub\Footsies\Demos\VsHybridLong.demo 
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 5000
    threaded: false
    behavioral_cloning:
      demo_path: C:\Users\Ciaran\Documents\GitHub\Footsies\Demos\VsHybridLong.demo
      strength: 0.1  
      steps: 100000 
  

    

